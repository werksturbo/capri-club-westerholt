<!-- ZENTRALER HEADER / NAVIGATION -->
<style>

        .mobile-menu-toggle {
            display: none;
        }


        @media (max-width: 900px) {

            header {
                position: relative !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                min-height: 74px !important;
                height: auto !important;
                padding: 8px 14px !important;
                box-sizing: border-box !important;
            }


            header .logo {
                flex: 0 1 auto !important;
                min-width: 0 !important;
                margin: 0 auto !important;
                text-align: center !important;
            }


            header .logo img {
                display: block !important;
                width: auto !important;
                max-width: min(72vw, 300px) !important;
                max-height: 58px !important;
                margin: 0 !important;
            }


            /* Hamburger */

            .mobile-menu-toggle {
                position: absolute !important;
                left: 14px !important;
                top: 50% !important;
                transform: translateY(-50%) !important;

                width: 48px !important;
                height: 48px !important;

                margin: 0 !important;
                padding: 9px 8px !important;

                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                gap: 5px !important;

                border: 1px solid rgba(255,255,255,.35) !important;
                border-radius: 8px !important;

                background: rgba(255,255,255,.10) !important;
                color: inherit !important;

                cursor: pointer !important;

                box-sizing: border-box !important;

                z-index: 10001 !important;
            }


            .mobile-menu-toggle span {
                display: block !important;

                width: 25px !important;
                height: 3px !important;

                border-radius: 3px !important;

                background: currentColor !important;
            }


            /* =====================================================
               MOBILE NAVIGATION
               ===================================================== */

            header nav {
                display: none !important;

                position: absolute !important;

                z-index: 10000 !important;

                top: calc(100% - 1px) !important;

                left: 10px !important;
                right: 10px !important;

                width: auto !important;
                height: auto !important;

                max-height: calc(100vh - 90px) !important;

                overflow-y: auto !important;

                margin: 0 !important;
                padding: 6px 0 !important;

                border-radius: 0 0 10px 10px !important;

                box-sizing: border-box !important;

                background: #05019B !important;

            }


            header.nav-open nav {
                display: block !important;
            }


            header nav ul {
                display: flex !important;

                flex-direction: column !important;
                align-items: stretch !important;

                width: 100% !important;
                height: auto !important;

                margin: 0 !important;
                padding: 0 !important;

                list-style: none !important;

                gap: 0 !important;
            }


            header nav li {
                display: block !important;

                width: 100% !important;
                height: auto !important;

                margin: 0 !important;
                padding: 0 !important;
            }


            header nav li a {
                display: block !important;

                width: 100% !important;

                min-height: 45px !important;

                padding: 11px 18px !important;

                box-sizing: border-box !important;

                text-align: left !important;

                font-size: 17px !important;
                line-height: 1.3 !important;

                white-space: normal !important;

                border-radius: 0 !important;
            }


            /* Aktive Seite */

            header nav li a.active {
                background: rgba(255,255,255,.16) !important;
            }

        }


        /* =========================================================
           SEHR KLEINE SMARTPHONES
           ========================================================= */

        @media (max-width: 420px) {

            header {
                min-height: 66px !important;
                padding: 6px 10px !important;
            }


            header .logo img {
                max-width: 68vw !important;
                max-height: 52px !important;
            }


            .mobile-menu-toggle {
                left: 10px !important;

                width: 44px !important;
                height: 44px !important;
            }

        }


        /* =========================================================
           CCW NAVIGATION – Dropdown-Menüs
           ========================================================= */

        header nav ul {
            align-items: center;
        }


        header nav li {
            position: relative;
        }


        header nav li.has-submenu {
            display: flex;
            align-items: stretch;
        }


        .submenu-toggle {
            appearance: none;
            border: 0;
            margin: 0;
            padding: 12px 14px;
            background: transparent;
            color: white;
            font: inherit;
            font-weight: 600;
            font-size: 16px;
            line-height: 1.2;
            cursor: pointer;
            white-space: nowrap;
        }


        .submenu-toggle .arrow {
            display: inline-block;
            margin-left: 5px;
            font-size: 12px;
            transition: transform .18s ease;
        }


        .has-submenu.submenu-open .submenu-toggle .arrow {
            transform: rotate(180deg);
        }


        header nav ul.submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 10002;
            min-width: 220px;
            margin: 0;
            padding: 6px 0;
            list-style: none;
            background: #05019B;
            box-shadow: 0 8px 20px rgba(0,0,0,.28);
        }


        .has-submenu.submenu-open > ul.submenu {
            display: block;
        }


        header nav ul.submenu li {
            display: block;
            width: 100%;
        }


        header nav ul.submenu a {
            display: block;
            width: 100%;
            min-height: auto;
            padding: 10px 16px;
            box-sizing: border-box;
            text-align: left;
            white-space: normal;
            border-radius: 0;
        }


        /* Leere Dropdowns bleiben zunächst unsichtbar – sie dienen als
           Platzhalter, bis wir die echten Unterseiten übernehmen. */

        header nav ul.submenu:empty {
            display: none !important;
        }


        @media (max-width: 900px) {

            header nav ul {
                align-items: stretch;
            }


            header nav li.has-submenu {
                display: block;
            }


            .submenu-toggle {
                display: block;
                width: 100%;
                min-height: 45px;
                padding: 11px 18px;
                box-sizing: border-box;
                text-align: left;
                font-size: 17px;
                line-height: 1.3;
                white-space: normal;
            }


            header nav ul.submenu {
                position: static;
                min-width: 0;
                padding: 0;
                box-shadow: none;
                background: rgba(0,0,0,.12);
            }


            header nav ul.submenu a {
                padding: 10px 18px 10px 34px;
                font-size: 16px;
            }

        }

    </style>
