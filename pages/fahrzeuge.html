<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrzeug | Capri Club Westerholt</title>
    <link rel="stylesheet" href="../css/fahrzeuge.css">
</head>
<body>

<main class="fahrzeug-seite">

    <header class="fahrzeug-header">
        <h1 id="fahrzeug-titel">Fahrzeug wird geladen …</h1>
    </header>

    <section class="hauptbild-bereich">
        <a id="hauptbild-link" href="#" class="hauptbild-link" aria-label="Hauptbild vergrößern">
            <img id="hauptbild" src="" alt="">
        </a>
    </section>

    <section class="fahrzeugdaten">
        <table>
            <tbody>
                <tr>
                    <th>Typ</th>
                    <td id="typ"></td>
                </tr>
                <tr>
                    <th>Baujahr</th>
                    <td id="baujahr"></td>
                </tr>
                <tr>
                    <th>Motor / Zyl. / PS</th>
                    <td id="motor"></td>
                </tr>
                <tr>
                    <th>Eigentümer</th>
                    <td id="eigentümer"></td>
                </tr>
                <tr>
                    <th>Sonstiges</th>
                    <td id="sonstiges"></td>
                </tr>
                <tr>
                    <th>2016</th>
                    <td id="geschichte"></td>
                </tr>
            </tbody>
        </table>
    </section>

    <section class="galerie-bereich">
        <div id="galerie" class="galerie"></div>
        <p id="keine-bilder" class="keine-bilder">
            Die weiteren Fahrzeugbilder werden hier später ergänzt.
        </p>
    </section>

</main>

<!--
    WICHTIG:
    Die Galerie ist bewusst so aufgebaut, dass eure bereits vorhandene
    Lightbox später direkt eingebunden werden kann.
    Die Links besitzen die Klasse "gallery-link" und das Attribut
    data-lightbox="fahrzeug".
-->

<script src="../js/fahrzeuge.js"></script>
</body>
</html>
