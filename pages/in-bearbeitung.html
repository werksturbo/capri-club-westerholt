<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite in Bearbeitung | Capri Club Westerholt e.V.</title>
    <meta name="description" content="Diese Seite des Capri Club Westerholt wird gerade überarbeitet.">
    <link rel="stylesheet" href="../css/home.css">
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon"
          href="../images/favicon_set/favicon.ico">

    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="../images/favicon_set/favicon-32x32.png">

    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="../images/favicon_set/favicon-16x16.png">

    <link rel="apple-touch-icon"
          sizes="180x180"
          href="../images/favicon_set/apple-touch-icon.png">

    <link rel="manifest"
          href="../images/favicon_set/site.webmanifest">

    <meta name="theme-color" content="#000000">

<style>
        .maintenance-main {
            max-width: 1200px;
            margin: 28px auto 42px;
            padding: 0 18px;
            box-sizing: border-box;
            text-align: center;
        }
        .maintenance-heading {
            margin: 0 auto 20px;
            padding: 22px 24px;
            color: #fff;
            background: linear-gradient(90deg, #05019B 0%, #1d7fc3 100%);
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,.10);
        }
        .maintenance-heading h1 {
            margin: 0 0 8px;
            font-size: clamp(24px, 3vw, 34px);
            line-height: 1.2;
        }
        .maintenance-heading p {
            margin: 0;
            font-size: 17px;
            line-height: 1.5;
        }
        .maintenance-image-wrap {
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            background: #eef1f5;
            box-shadow: 0 6px 20px rgba(0,0,0,.14);
        }
        .maintenance-image {
            display: block;
            width: 100%;
            height: auto;
        }
        .maintenance-note {
            margin: 22px auto 12px;
            color: #243746;
            font-size: 18px;
            line-height: 1.5;
        }
        .maintenance-home a {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 7px;
            background: #05019B;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        .maintenance-home a:hover {
            background: #1d7fc3;
        }
        @media (max-width: 600px) {
            .maintenance-main { margin-top: 18px; padding: 0 12px; }
            .maintenance-heading { padding: 18px 15px; }
            .maintenance-heading p { font-size: 15px; }
            .maintenance-note { font-size: 16px; }
        }
    </style>
</head>

<body>
<!-- Zentraler Header aus includes/header.html -->
<div id="header"></div>
<script>
fetch('../includes/header.html')
    .then(response => {
        if (!response.ok) throw new Error('Header konnte nicht geladen werden.');
        return response.text();
    })
    .then(data => {
        document.getElementById('header').innerHTML = data;

        const currentPage = (window.location.pathname.split('/').pop() || '').toLowerCase();
        const nav = document.getElementById('mainNavigation');

        if (nav) {
            nav.querySelectorAll('a.active, .submenu-toggle.active')
                .forEach(el => el.classList.remove('active'));

            const currentLink = Array.from(nav.querySelectorAll('a[href]')).find(link => {
                const target = (link.getAttribute('href') || '')
                    .split(/[?#]/)[0].split('/').pop().toLowerCase();
                return target === currentPage;
            });

            if (currentLink) {
                currentLink.classList.add('active');
                const parent = currentLink.closest('.has-submenu');
                const parentButton = parent && parent.querySelector('.submenu-toggle');
                if (parentButton) parentButton.classList.add('active');
            }
        }

        const header = document.querySelector('#header header');
        const toggle = document.getElementById('mobileMenuToggle');
        if (!header || !toggle || !nav) return;

        function closeMobileMenu() {
            header.classList.remove('nav-open');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', 'Menü öffnen');
        }

        function closeAllSubmenus(except) {
            nav.querySelectorAll('.has-submenu').forEach(item => {
                if (item !== except) {
                    item.classList.remove('submenu-open');
                    const button = item.querySelector('.submenu-toggle');
                    if (button) button.setAttribute('aria-expanded', 'false');
                }
            });
        }

        toggle.addEventListener('click', event => {
            event.stopPropagation();
            const open = header.classList.toggle('nav-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
        });

        nav.querySelectorAll('.has-submenu').forEach(item => {
            const button = item.querySelector('.submenu-toggle');
            if (!button) return;
            button.addEventListener('click', event => {
                event.preventDefault();
                event.stopPropagation();
                const isOpen = item.classList.contains('submenu-open');
                closeAllSubmenus(item);
                item.classList.toggle('submenu-open', !isOpen);
                button.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
            });
        });

        nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
            closeAllSubmenus();
            closeMobileMenu();
        }));

        document.addEventListener('click', event => {
            if (!header.contains(event.target)) {
                closeAllSubmenus();
                closeMobileMenu();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeAllSubmenus();
                closeMobileMenu();
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) closeMobileMenu();
        });
    })
    .catch(error => console.error('Fehler beim Laden des Headers:', error));
</script>

<main class="maintenance-main">
        <section class="maintenance-heading">
            <h1>Wir schrauben gerade an unserer Homepage!</h1>
            <p>Keine Sorge – der Capri bleibt in Ruhe. Wir bringen diese Seite auf Vordermann.</p>
        </section>

        <section class="maintenance-image-wrap" aria-label="Seite in Bearbeitung">
            <img
                class="maintenance-image"
                src="../images/seite-in-bearbeitung.png"
                alt="Mitglied des Capri Club Westerholt arbeitet am Laptop an der Club-Homepage. Im Hintergrund stehen ein klassischer Capri und ein Schild mit der Aufschrift Seite in Bearbeitung."
                loading="eager">
        </section>

        <p class="maintenance-note">
            Diese Seite wird derzeit überarbeitet. Schau gerne bald wieder vorbei!
        </p>
    </main>





<!-- FOOTER -->

                <!-- =============================================================================
                     footer        footer
                     ============================================================================= -->


    
                <div id="footer"></div>

                <script>
                        fetch('../includes/footer.html')
                        .then(response => response.text())
                        .then(data => {
                                        document.getElementById('footer').innerHTML = data;
                                      });
                </script>





</body>
</html>
